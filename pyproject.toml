[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.envs.default]
detached = true
dependencies = [
  "pytest",
  "frozendict~=2.4.6",
  "Jinja2~=3.1.5",
  "requests~=2.33.1",
  "xemu-pgraph-ci-tools @ git+https://github.com/abaire/xemu-pgraph-ci-tools.git",
]

[tool.hatch.envs.hatch-test]
skip-install = true
extra-dependencies = [
  "frozendict~=2.4.6",
  "Jinja2~=3.1.5",
  "requests~=2.33.1",
  "xemu-pgraph-ci-tools @ git+https://github.com/abaire/xemu-pgraph-ci-tools.git",
]

[tool.hatch.envs.hatch-static-analysis]
detached = true
dependencies = [
  "mypy==2.3.1",
  "ruff==0.16.4",
]

[tool.hatch.envs.types]
detached = true
dependencies = [
  "mypy==2.3.1",
  "pytest",
  "frozendict~=2.4.6",
  "Jinja2~=3.1.5",
  "requests~=2.33.1",
  "xemu-pgraph-ci-tools @ git+https://github.com/abaire/xemu-pgraph-ci-tools.git",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive .github/scripts tests"

[tool.ruff]
extend-exclude = ["submodules"]

[tool.mypy]
ignore_missing_imports = true
