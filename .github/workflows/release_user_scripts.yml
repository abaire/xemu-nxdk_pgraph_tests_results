name: Release User Scripts

on:
  push:
    branches:
      - main
    paths:
      - 'user_scripts/**'
      - 'README.md'
      - '.github/workflows/release_user_scripts.yml'
      - '.github/scripts/extract_readme.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and Release User Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Extract README instructions
        run: python3 .github/scripts/extract_readme.py

      - name: Create artifacts directory
        run: mkdir -p dist_release

      - name: Package for Windows
        run: |
          mkdir -p package/windows
          cp user_scripts/run.bat package/windows/
          cp user_scripts/execute.py package/windows/
          cp user_scripts/requirements.txt package/windows/
          cp dist/README.md package/windows/
          cd package/windows && zip -r ../../dist_release/UserScripts-Windows.zip .

      - name: Package for macOS
        run: |
          mkdir -p package/macos
          cp user_scripts/run.sh package/macos/
          cp user_scripts/execute.py package/macos/
          cp user_scripts/requirements.txt package/macos/
          cp dist/README.md package/macos/
          chmod +x package/macos/run.sh
          cd package/macos && zip -r ../../dist_release/UserScripts-macOS.zip .

      - name: Package for Linux
        run: |
          mkdir -p package/linux
          cp user_scripts/run.sh package/linux/
          cp user_scripts/execute.py package/linux/
          cp user_scripts/requirements.txt package/linux/
          cp dist/README.md package/linux/
          chmod +x package/linux/run.sh
          cd package/linux && zip -r ../../dist_release/UserScripts-Linux.zip .

      - name: Generate version
        id: version
        run: echo "tag=scripts-v$(date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "User Scripts - ${{ steps.version.outputs.tag }}"
          body: "Scripts that may be used to submit test results."
          draft: false
          prerelease: false
          files: |
            dist_release/UserScripts-Windows.zip
            dist_release/UserScripts-macOS.zip
            dist_release/UserScripts-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
