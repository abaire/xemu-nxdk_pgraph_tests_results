name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      xemu_version:
        description: 'Target xemu version or pattern to re-evaluate from archive (e.g. xemu-0.8.135, or all)'
        required: false
        default: ''
        type: string
      force_regenerate:
        description: 'Force re-compute all diffs for target version(s)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  find-changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      archive_results: ${{ steps.filter.outputs.archive_results }}
      site: ${{ steps.filter.outputs.site }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '1'
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            archive_results:
              - '.github/workflows/*.yml'
              - 'results/**'
            site:
              - '.github/workflows/*.yml'
              - '.github/scripts/**'
              - '.github/site/**'
              - 'results/**'
            scripts:
              - '.github/workflows/*.yml'
              - 'dev_scripts/compare.py'
              - 'user_scripts/*'

  ImportResults:
    needs: [ find-changes ]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
        (
          (needs.find-changes.outputs.site == 'true' || needs.find-changes.outputs.archive_results == 'true') &&
            github.ref == 'refs/heads/main' &&
            github.event_name == 'push'
        )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main-branch
      - uses: actions/checkout@v7
        with:
          ref: github_pages
          path: github-pages-branch
          fetch-depth: 0
      - name: Sync site scripts
        run: |
          mkdir -p github-pages-branch/.github/scripts
          rsync -avz main-branch/.github/scripts/ github-pages-branch/.github/scripts/
          mkdir -p github-pages-branch/dev_scripts
          rsync -avz main-branch/dev_scripts/ github-pages-branch/dev_scripts/
      - name: Sync Results
        run: |
          mkdir -p github-pages-branch/results
          rsync -avz main-branch/results/ github-pages-branch/results/
      - name: Restore Archived Results (if requested)
        if: github.event_name == 'workflow_dispatch' && inputs.xemu_version != ''
        run: |
          python3 main-branch/.github/scripts/restore_archived_version.py \
            --version "${{ inputs.xemu_version }}" \
            ${{ inputs.force_regenerate && '--force' || '' }} \
            --target-dir github-pages-branch
      - name: Prepare artifact
        run: |
          cd github-pages-branch
          git add .github/scripts/
          git add dev_scripts/
          git add results/
          git add compare-results/
          
          # Identify changed files (cached diff)
          CHANGED_FILES=$(git diff --name-only --cached)
          
          mkdir -p ../artifact-staging
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No changes detected."
            touch ../artifact-staging/KEEP_ARTIFACT
          else
            echo "Changes detected:"
            echo "$CHANGED_FILES"
          
            # Copy changed files to artifact staging, preserving structure
            # We use rsync with --files-from to handle paths correctly
            echo "$CHANGED_FILES" > changed_files_list.txt
            rsync -av --files-from=changed_files_list.txt . ../artifact-staging/
          fi
      - name: Upload data
        uses: actions/upload-artifact@v7
        with:
          name: updated-data
          path: artifact-staging/
          retention-days: 1
          include-hidden-files: true

  PlanDiffs:
    needs: [ find-changes, ImportResults ]
    runs-on: ubuntu-latest
    if: needs.ImportResults.result == 'success'
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      diff_count: ${{ steps.plan.outputs.diff_count }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: github_pages
      - uses: actions/download-artifact@v8
        with:
          name: updated-data
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: Install requirements
        run: |
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt
      - name: Plan diff tasks
        id: plan
        run: python3 .github/scripts/plan_hw_diffs.py --max-shards 32 --output-plan-file diff_tasks.json
      - name: Upload plan artifact
        if: steps.plan.outputs.diff_count > '0'
        uses: actions/upload-artifact@v7
        with:
          name: diff-plan
          path: diff_tasks.json
          retention-days: 1

  DiffAgainstHW:
    needs: [ ImportResults, PlanDiffs ]
    name: Diff shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    if: needs.PlanDiffs.outputs.diff_count > '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.PlanDiffs.outputs.matrix) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: github_pages
      - uses: actions/download-artifact@v8
        with:
          name: updated-data
      - uses: actions/download-artifact@v8
        with:
          name: diff-plan
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: Install requirements
        run: |
          sudo apt-get update && sudo apt-get install -y perceptualdiff
          export PIP_BREAK_SYSTEM_PACKAGES=1
          pip3 install -r .github/scripts/requirements.txt -r dev_scripts/requirements.txt
      - name: Generate diffs
        run: |
          python3 .github/scripts/generate_missing_hw_diffs.py \
            --tasks-file diff_tasks.json \
            --shard-index ${{ matrix.shard }} \
            --shard-count ${{ needs.PlanDiffs.outputs.shard_count }}
      - name: Prepare partial diffs
        run: |
          mkdir -p diff-staging
          CHANGED_DIFFS=$(git ls-files --others --modified --exclude-standard compare-results)
          if [ -z "$CHANGED_DIFFS" ]; then
            echo "No new or modified diffs for shard ${{ matrix.shard }}."
            touch diff-staging/KEEP_ARTIFACT
          else
            echo "New or modified diffs detected for shard ${{ matrix.shard }}:"
            echo "$CHANGED_DIFFS"
            echo "$CHANGED_DIFFS" > changed_diffs_list.txt
            rsync -av --files-from=changed_diffs_list.txt . diff-staging/
          fi
      - name: Upload partial diffs
        uses: actions/upload-artifact@v7
        with:
          name: diffs-${{ strategy.job-index }}
          path: diff-staging/
          retention-days: 1

  Publish:
    runs-on: ubuntu-latest
    needs: [ ImportResults, PlanDiffs, DiffAgainstHW ]
    if: |
      always() &&
      needs.ImportResults.result == 'success' &&
      (needs.DiffAgainstHW.result == 'success' || needs.DiffAgainstHW.result == 'skipped')
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: github_pages
      - uses: actions/download-artifact@v8
        with:
          name: updated-data
      - name: Download shard diffs
        if: needs.DiffAgainstHW.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: diffs-*
          path: incoming-diffs/
      - name: Merge diffs
        run: |
          if [ -d incoming-diffs ]; then
            echo "Merging incoming shard diffs..."
            for diff_dir in incoming-diffs/diffs-*; do
              if [ -d "$diff_dir" ]; then
                echo "Merging $diff_dir..."
                rsync -av --exclude="KEEP_ARTIFACT" "$diff_dir/" .
              fi
            done
            rm -rf incoming-diffs
          fi
          rm -f KEEP_ARTIFACT
      - uses: actions/setup-python@v7
        with: { python-version: '3.12', cache: 'pip' }
      - name: Install requirements
        run: pip3 install -r .github/scripts/requirements.txt
      - name: Reduce shard summaries
        run: python3 .github/scripts/merge_comparison_summaries.py --comparison-dir compare-results
      - name: Generate site content
        run: |
          python3 .github/scripts/generate_results_site.py results .github/site \
            --comparison-dir compare-results \
            --base-url https://raw.githubusercontent.com/${{ github.repository }}/github_pages \
            -v
      - name: Commit and Push
        run: |
          git config --local user.email "$GITHUB_ACTOR+github-actions@users.noreply.github.com"
          git config --local user.name "$GITHUB_ACTOR via action"
          
          git add results/ .github/scripts/ compare-results/ .github/site/
          
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Update results and site $GITHUB_RUN_NUMBER"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.github/site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  ArchiveResults:
    needs: [ Publish ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.Publish.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout github_pages
        uses: actions/checkout@v7
        with:
          ref: github_pages
          fetch-depth: 0 # Need full history and remotes for sync
      - name: Sync all version archives
        run: |
          git config --local user.email "$GITHUB_ACTOR+github-actions@users.noreply.github.com"
          git config --local user.name "$GITHUB_ACTOR via action"
          python3 .github/scripts/sync_archives.py

  CleanupMain:
    needs: [ ArchiveResults ]
    runs-on: ubuntu-latest
    if: |
      always() && 
      (needs.ArchiveResults.result == 'success' || needs.ArchiveResults.result == 'skipped') && 
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Remove images from results
        run: |
          git config --local user.email "$GITHUB_ACTOR+github-actions@users.noreply.github.com"
          git config --local user.name "$GITHUB_ACTOR via action"
          
          # Find all PNG files in results/ and remove them
          find results -name "*.png" -delete
          
          # Add changes to git index
          git add -u results/
          
          # Check if there are changes to commit
          if git diff-index --quiet HEAD; then
            echo "No changes to commit"
          else
            git commit -m "Remove processed result images [skip ci]"
            git push
          fi
